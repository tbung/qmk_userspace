name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: master

  keymap-image:
    name: Generate keymap image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Userspace
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          path: qmk_firmware
          repository: ${{ inputs.qmk_repo || 'qmk/qmk_firmware' }}
          ref: ${{ inputs.qmk_ref || 'master' }}

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade qmk
          python3 -m pip install -r qmk_firmware/requirements.txt
          python3 -m pip install --upgrade keymap-drawer
          sudo apt install -y inkscape gsfonts gsfonts-other

      - name: Configure QMK CLI
        run: |
          qmk config userspace_compile.parallel=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null)
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE

      - name: Validate userspace
        run: |
          qmk userspace-doctor

      - name: Render images
        run: |
          qmk c2json --no-cpp -kb ergodox_ez/base -km tbung -o keymap.json
          keymap -c .github/keymap_config.yaml parse -l default onehand symbols osnav swapped system -q keymap.json -o keymap.yaml
          keymap -c .github/keymap_config.yaml draw -o keymap.svg keymap.yaml
          inkscape --export-background-opacity=0  ./keymap.svg -o keymap.png

      - name: Upload images
        uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        continue-on-error: true
        with:
          name: keymap
          path: |
            keymap.svg
            keymap.png

  publish:
    name: Publish
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    needs: [build, keymap-image]

    steps:
      - name: Download binaries
        if: always() && !cancelled()
        uses: actions/download-artifact@v4

      - name: Generate Release
        uses: softprops/action-gh-release@v2
        if: always() && !cancelled()
        with:
          token: ${{ github.token }}
          name: Latest QMK Firmware
          tag_name: 'latest'
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          files: |
            **/*.hex
            **/*.bin
            **/*.uf2
            **/*.svg
            **/*.png
